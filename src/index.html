<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta charset="UTF-8" />
    <!--
      'unsafe-eval': better-sqlite3 compiles its row constructors with Function().
      Page scripts have Node.js integration, so this doesn't let them do anything new.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self' 'unsafe-eval'; worker-src 'self' blob:"
    />
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
