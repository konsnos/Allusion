# This is the config for the github actions that creates new releases
name: Build/release

on:
  workflow_dispatch:
  # Create a release for tag pushes starting with 'v'
  push:
    tags:
      - v*

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      # Publishing to GitHub Releases
      contents: write

    strategy:
      fail-fast: false
      matrix:
        # Building on ubuntu-22.04 lets the AppImage run on distributions with an older glibc
        os: [macos-latest, ubuntu-22.04, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      # --ignore-scripts: Yarn v1 ignores better-sqlite3's "gypfile": false and runs
      # `node-gyp rebuild`, which fails on runners whose Visual Studio is newer than the
      # node-gyp bundled with npm (windows-latest ships VS 2026). The compiled output is
      # unused anyway: better-sqlite3 loads its bundled prebuilds, and those are what we package.
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Build app
        run: yarn build

      # If the commit is tagged with a version (e.g. "v1.0.0"), release the app after building
      - name: Package app
        run: yarn electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: allusion-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
