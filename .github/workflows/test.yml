# This is the config for the github actions that test commits and builds
name: Build/test

on:
  # Test all commits to master
  push:
    branches:
      - master
  # Only test pull requests to master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Test Code
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn test

  build:
    # The release workflow already builds master
    if: github.ref != 'refs/heads/master'
    name: Test Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js and Yarn
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build app
        run: yarn build

      - name: Package app
        run: yarn electron-builder --publish never
